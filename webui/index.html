<!doctype html>
<html lang="en" class="dark" data-theme="dark" style="background-color: #000 !important; color: #fff !important; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>ResoStage</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #000 !important;
        color: #fff !important;
        overflow: hidden !important;
      }
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      #loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        background-color: #000 !important;
        pointer-events: none;
        z-index: 999999;
        overflow: hidden !important;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.18s ease-out, visibility 0.18s ease-out;
      }
      #loading-overlay span {
        display: inline-block;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.2em;
        margin-right: -0.2em;
        line-height: 1;
        text-transform: uppercase;
        color: #ffffff;
        opacity: 0;
        animation: fadeInLoadingText 0.15s ease-out forwards;
        user-select: none;
        -webkit-user-select: none;
      }
      @keyframes fadeInLoadingText {
        from { opacity: 0; }
        to   { opacity: 0.1; }
      }
      .loading-overlay-hidden {
        opacity: 0 !important;
        visibility: hidden !important;
      }
    </style>
  </head>
  <body style="background-color: #000 !important; color: #fff !important; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden !important;">
    <div id="loading-overlay">
      <span>LOADING</span>
    </div>
    <div id="root" style="margin: 0; padding: 0; width: 100%; height: 100%;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
