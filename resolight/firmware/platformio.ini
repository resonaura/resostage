; ResoLight firmware — ESP32 / ESP8266.
; Both envs compile the same src/main.cpp against shared/ResoLightProtocol.h
; and src/generated/BoardConfig.h (produced by the TypeScript CLI from
; config.yaml — never hand-edit the generated header).
;
; Prefer the pnpm scripts (they generate config first):
;   pnpm --dir resolight/firmware build
;   pnpm --dir resolight/firmware flash

[platformio]
default_envs = esp32
src_dir = src

[env]
framework = arduino
monitor_speed = 115200
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=0
  -I${PROJECT_DIR}/shared
  -I${PROJECT_DIR}/src
lib_deps =
  links2004/WebSockets@^2.4.1
  fastled/FastLED@^3.7.0
build_src_filter = +<*> -<generated/*>

[env:esp32]
platform = espressif32
board = esp32dev
build_flags =
  ${env.build_flags}
  -DRESOLIGHT_ESP32=1

[env:esp8266]
platform = espressif8266
board = nodemcuv2
board_build.f_cpu = 160000000L
build_flags =
  ${env.build_flags}
  -DRESOLIGHT_ESP8266=1
